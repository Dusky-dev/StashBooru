fragment MediaListItem on MediaItem {
  id
  kind
  stack_match_count
  image {
    ...SlimImageData
  }
  scene {
    ...SlimSceneData
  }
}

query FindMedia($filter: FindFilterType, $media_filter: MediaFilterType) {
  findMedia(filter: $filter, media_filter: $media_filter) {
    count
    matched_count
    image_count
    video_count
    items {
      ...MediaListItem
    }
  }
}
