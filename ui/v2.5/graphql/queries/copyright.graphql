query FindCopyright($id: ID!) {
  findCopyright(id: $id) {
    ...CopyrightData
  }
}

query FindCopyrights($filter: FindFilterType, $ids: [ID!]) {
  findCopyrights(filter: $filter, ids: $ids) {
    count
    copyrights {
      ...CopyrightListData
    }
  }
}

query FindCopyrightsForSelect($filter: FindFilterType, $ids: [ID!]) {
  findCopyrights(filter: $filter, ids: $ids) {
    count
    copyrights {
      ...SlimCopyrightData
    }
  }
}
