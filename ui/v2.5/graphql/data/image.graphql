fragment ImageData on Image {
  visual_stack {
    ...VisualStackSummary
  }
  id
  title
  code
  rating100
  date
  urls
  details
  photographer
  organized
  o_counter
  created_at
  updated_at

  paths {
    thumbnail
    preview
    image
  }

  galleries {
    ...GalleryData
  }

  studio {
    ...SlimStudioData
  }

  artists {
    ...SlimStudioData
  }

  tags {
    ...SlimTagData
  }

  copyrights {
    ...SlimCopyrightData
    breadcrumb {
      ...SlimCopyrightData
    }
  }

  ordered_copyrights {
    ...SlimCopyrightData
    breadcrumb {
      ...SlimCopyrightData
    }
  }

  primary_copyright {
    ...SlimCopyrightData
  }

  performers {
    ...PerformerData
  }

  effective_associations {
    tags {
      ...SlimTagData
    }
    artists {
      ...SlimStudioData
      scene_count
      image_count
    }
    performers {
      ...PerformerData
    }
    copyrights {
      ...SlimCopyrightData
      scene_count
      image_count
      breadcrumb {
        ...SlimCopyrightData
        scene_count
        image_count
      }
    }
    provenance {
      association_type
      association_id
      origins {
        kind
        source_type
        source_id
        via_type
        via_id
        source_tag_id
      }
    }
  }

  visual_files {
    ...VisualFileData
  }

  custom_fields
}
