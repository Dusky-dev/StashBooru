# APPNICENAME=StashBooru
# APPDESCRIPTION=An anime/cartoon-focused media organizer based on Stash
services:
  stash:
    image: ghcr.io/dusky-dev/stashbooru:develop
    container_name: stash
    restart: unless-stopped
    ## the container's HTTP port must be the same with STASH_PORT in the environment section
    ## local HTTPS is enabled by default on 9443 while HTTP remains available for reverse proxies
    ports:
      - "9999:9999"
      - "${STASH_LOCAL_HTTPS_PORT:-9443}:${STASH_LOCAL_HTTPS_PORT:-9443}"
    ## If you intend to use stash's DLNA functionality uncomment the below network mode and comment out the above ports section
    # network_mode: host
    logging:
      driver: "json-file"
      options:
        max-file: "10"
        max-size: "2m"
    environment:
      - STASH_STASH=/data/
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/metadata/
      - STASH_CACHE=/cache/
      ## Adjust below to change default HTTP port (9999)
      - STASH_PORT=9999
      ## Local HTTPS is enabled by default. The generated certificate persists in ./config.
      - STASH_LOCAL_HTTPS_ENABLED=${STASH_LOCAL_HTTPS_ENABLED:-true}
      - STASH_LOCAL_HTTPS_PORT=${STASH_LOCAL_HTTPS_PORT:-9443}
      ## Docker bridge networking cannot discover the host LAN IP. Set this to your server
      ## LAN IP (or comma-separated IPs/hostnames) to include raw-IP access in certificate SANs.
      ## Example in .env: STASH_LOCAL_HTTPS_HOSTS=192.168.1.10
      - STASH_LOCAL_HTTPS_HOSTS=${STASH_LOCAL_HTTPS_HOSTS:-}
      ## Set your timezone, e.g. America/New_York or Europe/Berlin
      ## see https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - TZ=Etc/UTC
    volumes:
      ## Adjust below paths (the left part) to your liking.
      ## E.g. you can change ./config:/root/.stash to ./stash:/root/.stash
      ## The left part is the path on your host, the right part is the path in the stash container.

      ## Keep configs, scrapers, plugins, and the generated local HTTPS certificate here.
      - ./config:/root/.stash
      ## Point this at your collection.
      ## The left side is where your collection is on your host, the right side is where it will be in stash.
      - ./data:/data
      ## This is where your stash's metadata lives
      - ./metadata:/metadata
      ## Any other cache content.
      - ./cache:/cache
      ## Where to store binary blob data (scene covers, images)
      - ./blobs:/blobs
      ## Where to store generated content (screenshots,previews,transcodes,sprites)
      - ./generated:/generated
