name: Temporary PR64 toolbar wrapper migration

on:
  push:
    branches:
      - fix/unified-media-preserve-native-children

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/unified-media-preserve-native-children
          fetch-depth: 0

      - name: Patch sources
        run: python3 .github/scripts/tmp_pr64_patch.py

      - name: Validate built-in bundle
        working-directory: ui/v2.5
        run: |
          node scripts/prepare-builtins.mjs
          node --check public/builtin/unifiedMedia.js

      - name: Check diff
        run: git diff --check

      - name: Commit source fix and remove temporary helpers
        run: |
          rm .github/workflows/tmp-pr64-toolbar-wrapper.yml
          rm .github/scripts/tmp_pr64_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/v2.5/src/components/Scenes/SceneList.tsx ui/v2.5/builtin-source/unifiedMedia.05.part ui/v2.5/scripts/prepare-builtins.mjs .github/workflows/tmp-pr64-toolbar-wrapper.yml .github/scripts/tmp_pr64_patch.py
          git commit -m "Move Unified Media toolbar patch off FilteredSceneList tree"
          git push origin HEAD:fix/unified-media-preserve-native-children
