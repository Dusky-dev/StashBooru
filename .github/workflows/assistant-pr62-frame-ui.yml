name: Apply PR62 frame tagging UI patch

on:
  push:
    branches:
      - feature/video-frame-assisted-tagging

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/video-frame-assisted-tagging
          fetch-depth: 0
      - name: Patch route and Video Tagging UI
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def d(value):
              return dedent(value).lstrip("\n")

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          routes = "internal/api/routes_scene.go"
          replace(
              routes,
              '\t\tr.Get("/booru-metadata", rs.SceneBooruMetadata)\n',
              '\t\tr.Get("/booru-metadata", rs.SceneBooruMetadata)\n\t\tr.Get("/frame-metadata", rs.SceneFrameMetadata)\n',
          )
          replace(
              routes,
              "\t\t// source review flow without running image-only model inference.\n",
              "\t\t// source review flow. Frame inference remains explicit and never runs on open.\n",
          )

          ui = "ui/v2.5/src/components/Scenes/SceneDetails/VideoTaggingDialog.tsx"
          replace(ui, 'type MetadataSourceKind = "local" | "booru";', 'type MetadataSourceKind = "local" | "booru" | "frames";')
          replace(
              ui,
              d("""
              const SOURCE_PRIORITY: Record<MetadataSourceKind, number> = {
                local: 0,
                booru: 10,
              };
              """),
              d("""
              const SOURCE_PRIORITY: Record<MetadataSourceKind, number> = {
                local: 0,
                booru: 10,
                frames: 20,
              };
              """),
          )
          replace(
              ui,
              "interface AppliedEntity {",
              d("""
              interface FrameMetadataResponse {
                backend: "local" | "remote";
                model: string;
                threshold: number;
                limit: number;
                sampleTimes: number[];
                tags: TagPrediction[];
              }

              interface AppliedEntity {
              """),
          )
          replace(
              ui,
              d("""
                const provider = prediction.source?.startsWith("booru:")
                  ? prediction.source.slice("booru:".length)
                  : undefined;
              """),
              d("""
                if (kind === "frames") {
                  const consensus = prediction.source?.match(/^frame-analysis:(\\d+)\\/(\\d+)$/);
                  return {
                    kind,
                    label: "Frames",
                    detail: consensus
                      ? `Frame analysis: ${consensus[1]}/${consensus[2]} sampled frames`
                      : "Frame analysis",
                    priority: SOURCE_PRIORITY.frames,
                  };
                }

                const provider = prediction.source?.startsWith("booru:")
                  ? prediction.source.slice("booru:".length)
                  : undefined;
              """),
          )
          replace(
              ui,
              d("""
              function mergeMetadataPredictions(
                localPredictions: TagPrediction[],
                booruPredictions: TagPrediction[]
              ): MetadataPrediction[] {
              """),
              d("""
              function mergeMetadataPredictions(
                localPredictions: TagPrediction[],
                booruPredictions: TagPrediction[],
                framePredictions: TagPrediction[]
              ): MetadataPrediction[] {
              """),
          )
          replace(
              ui,
              '  for (const prediction of booruPredictions) add(prediction, "booru");\n  return merged;',
              '  for (const prediction of booruPredictions) add(prediction, "booru");\n  for (const prediction of framePredictions) add(prediction, "frames");\n  return merged;',
          )
          replace(
              ui,
              d("""
              function sourceBadgeVariant(source: MetadataSourceKind) {
                return source === "local" ? "success" : "info";
              }
              """),
              d("""
              function sourceBadgeVariant(source: MetadataSourceKind) {
                if (source === "local") return "success";
                if (source === "frames") return "warning";
                return "info";
              }
              """),
          )
          replace(
              ui,
              '  const [booruMetadata, setBooruMetadata] = useState<BooruMetadataResponse>();\n',
              '  const [booruMetadata, setBooruMetadata] = useState<BooruMetadataResponse>();\n  const [framePredictions, setFramePredictions] = useState<TagPrediction[]>([]);\n  const [frameMetadata, setFrameMetadata] = useState<FrameMetadataResponse>();\n',
          )
          replace(
              ui,
              '  const [loadingBooru, setLoadingBooru] = useState(false);\n',
              '  const [loadingBooru, setLoadingBooru] = useState(false);\n  const [loadingFrames, setLoadingFrames] = useState(false);\n',
          )
          replace(
              ui,
              d("""
                const predictions = useMemo(
                  () => mergeMetadataPredictions(localPredictions, booruPredictions),
                  [booruPredictions, localPredictions]
                );
              """),
              d("""
                const predictions = useMemo(
                  () =>
                    mergeMetadataPredictions(
                      localPredictions,
                      booruPredictions,
                      framePredictions
                    ),
                  [booruPredictions, framePredictions, localPredictions]
                );
              """),
          )
          replace(
              ui,
              "  const grouped = useMemo(() => {",
              d("""
                const loadFrameMetadata = useCallback(async () => {
                  setLoadingFrames(true);
                  setError(undefined);
                  try {
                    const response = await fetch(`scene/${sceneId}/frame-metadata`);
                    const result = await readResponse<FrameMetadataResponse>(response);
                    setFrameMetadata(result);
                    setFramePredictions(result.tags);
                  } catch (cause) {
                    setError(cause instanceof Error ? cause.message : String(cause));
                  } finally {
                    setLoadingFrames(false);
                  }
                }, [sceneId]);

                const grouped = useMemo(() => {
              """),
          )
          replace(
              ui,
              '              disabled={loading || loadingBooru || applying}\n',
              '              disabled={loading || loadingBooru || loadingFrames || applying}\n',
          )
          replace(
              ui,
              d("""
                    {loadingBooru ? "Loading booru…" : "Load booru metadata"}
                  </Button>
                  <span className="ml-3 text-muted">
              """),
              d("""
                    {loadingBooru ? "Loading booru…" : "Load booru metadata"}
                  </Button>
                  <Button
                    className="ml-2"
                    variant="secondary"
                    disabled={loading || loadingBooru || loadingFrames || applying}
                    onClick={() => void loadFrameMetadata()}
                  >
                    {loadingFrames ? "Analyzing frames…" : "Analyze frames"}
                  </Button>
                  <span className="ml-3 text-muted">
              """),
          )
          replace(
              ui,
              d("""
                    Local filename metadata loads automatically. Camie and EVA02 image
                    inference are not run for Videos.
              """),
              d("""
                    Local filename metadata loads automatically. Frame inference runs
                    only when requested.
              """),
          )
          replace(
              ui,
              '          <Form.Check\n            className="mb-3"',
              d("""
                        {frameMetadata ? (
                          <div className="alert alert-warning py-2">
                            Analyzed {frameMetadata.sampleTimes.length} representative frame
                            {frameMetadata.sampleTimes.length === 1 ? "" : "s"}. Frame
                            suggestions start unselected and cannot override Local filename
                            identity.
                          </div>
                        ) : null}

                        <Form.Check
                          className="mb-3"
              """).rstrip("\n"),
          )
          replace(
              ui,
              d("""
                            No local metadata was found. You can still try an exact booru
                            lookup.
              """),
              d("""
                            No local metadata was found. You can still try an exact booru
                            lookup or explicitly analyze representative frames.
              """),
          )
          replace(
              ui,
              '              loading || loadingBooru || applying || visibleSelectedCount === 0\n',
              '              loading ||\n              loadingBooru ||\n              loadingFrames ||\n              applying ||\n              visibleSelectedCount === 0\n',
          )
          PY
          gofmt -w internal/api/routes_scene.go internal/api/video_tagging_frames.go internal/api/video_tagging_frames_test.go
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/api/routes_scene.go internal/api/video_tagging_frames.go internal/api/video_tagging_frames_test.go ui/v2.5/src/components/Scenes/SceneDetails/VideoTaggingDialog.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Add explicit frame-assisted Video Tagging"
            git push origin HEAD:feature/video-frame-assisted-tagging
          fi
