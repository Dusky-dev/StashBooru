name: PR61 alias collision route

on:
  push:
    branches:
      - feature/alias-collision-inspector
    paths:
      - .github/workflows/pr61-alias-route.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/alias-collision-inspector
      - name: Register endpoint and format Go
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("internal/api/routes_image.go")
          text = path.read_text()
          anchor = '\tr.Route("/{imageId}", func(r chi.Router) {\n'
          insert = '\tr.Get("/alias-collisions", rs.AliasCollisions)\n\n' + anchor
          if anchor not in text:
              raise SystemExit("image route anchor not found")
          path.write_text(text.replace(anchor, insert, 1))
          PY
          gofmt -w internal/api/alias_collision.go internal/api/alias_collision_test.go internal/api/routes_image.go
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/api/alias_collision.go internal/api/alias_collision_test.go internal/api/routes_image.go
          git commit -m "Expose read-only alias collision inspector"
          git push origin HEAD:feature/alias-collision-inspector
