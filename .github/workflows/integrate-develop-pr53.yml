name: Integrate develop into PR53
on:
  push:
    branches:
      - refactor/shared-tagging-domain-engine
    paths:
      - .github/workflows/integrate-develop-pr53.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/shared-tagging-domain-engine
          fetch-depth: 0
      - name: Merge current develop and self-clean
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git merge --no-edit origin/develop
          git rm .github/workflows/integrate-develop-pr53.yml
          git commit -m "Remove temporary PR53 integration workflow"
          git push origin HEAD:refactor/shared-tagging-domain-engine
