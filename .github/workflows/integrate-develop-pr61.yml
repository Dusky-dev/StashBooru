name: Integrate develop into PR61
on:
  push:
    branches:
      - feature/alias-collision-inspector
    paths:
      - .github/workflows/integrate-develop-pr61.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/alias-collision-inspector
          fetch-depth: 0
      - name: Merge develop and combine Alias Inspector with current Tools panel
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          feature_head="$(git rev-parse HEAD)"
          git show "$feature_head:ui/v2.5/src/components/Settings/SettingsToolsPanel.tsx" > /tmp/pr61-tools.tsx
          git merge -X theirs --no-edit origin/develop
          git checkout origin/develop -- internal/api/routes_image.go ui/v2.5/src/components/Settings/SettingsToolsPanel.tsx
          python - <<'PY'
          from pathlib import Path
          import re

          tools_path = Path("ui/v2.5/src/components/Settings/SettingsToolsPanel.tsx")
          old = Path("/tmp/pr61-tools.tsx").read_text()
          cur = tools_path.read_text()

          match = re.search(r'import \{([^}]*)\} from "react-bootstrap";', cur)
          if not match:
              raise SystemExit("react-bootstrap import not found")
          names = [name.strip() for name in match.group(1).split(",") if name.strip()]
          for needed in ["Alert", "Badge", "Button", "Form", "Table"]:
              if needed not in names:
                  names.append(needed)
          replacement = 'import { ' + ', '.join(names) + ' } from "react-bootstrap";'
          cur = cur[:match.start()] + replacement + cur[match.end():]

          section_marker = 'const SettingsToolsSection = PatchContainerComponent("SettingsToolsSection");\n'
          export_marker = '\nexport const SettingsToolsPanel: React.FC = () => {\n'
          if section_marker not in old or export_marker not in old:
              raise SystemExit("PR61 declaration anchors not found")
          declarations = old.split(section_marker, 1)[1].split(export_marker, 1)[0]
          if "interface AliasCollisionReference" not in cur:
              cur = cur.replace(section_marker, section_marker + declarations, 1)

          body = old.split(export_marker, 1)[1].split("  return (\n", 1)[0]
          if "const [collisions, setCollisions]" not in cur:
              cur = cur.replace(export_marker, export_marker + body, 1)

          alias_start = '          <Setting\n            heading="Alias Collision Inspector"'
          tools_close = '        </SettingsToolsSection>'
          if alias_start not in cur:
              if alias_start not in old or tools_close not in old or tools_close not in cur:
                  raise SystemExit("PR61 UI anchors not found")
              alias_fragment = alias_start + old.split(alias_start, 1)[1].split(tools_close, 1)[0]
              cur = cur.replace(tools_close, alias_fragment + tools_close, 1)

          tools_path.write_text(cur)

          routes_path = Path("internal/api/routes_image.go")
          routes = routes_path.read_text()
          route_anchor = '\n\tr.Route("/{imageId}", func(r chi.Router) {\n'
          alias_routes = '\n\tr.Get("/alias-collisions", rs.AliasCollisions)\n\tr.Get("/alias-collisions/inspect", rs.AliasCollisionInspect)\n'
          if 'rs.AliasCollisionInspect' not in routes:
              if route_anchor not in routes:
                  raise SystemExit("image route anchor not found")
              routes = routes.replace(route_anchor, alias_routes + route_anchor, 1)
          routes_path.write_text(routes)
          PY
          git add internal/api/routes_image.go ui/v2.5/src/components/Settings/SettingsToolsPanel.tsx
          git commit -m "Integrate Alias Collision Inspector with current Tools panel"
          git rm .github/workflows/integrate-develop-pr61.yml
          git commit -m "Remove temporary PR61 integration workflow"
          git push origin HEAD:feature/alias-collision-inspector
