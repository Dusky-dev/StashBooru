name: PR55 native identity fix
on:
  push:
    branches:
      - test/tagging-review-unit-tests
    paths:
      - .github/workflows/pr55-native-identity-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/tagging-review-unit-tests
      - name: Preserve exact native identity in shared review policy
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/v2.5/src/components/Tagging/taggingReviewPolicy.ts
          git diff --cached --quiet && exit 0
          git commit -m "Preserve exact native identity in policy tests"
          git push
