name: Experimental disposable complete media snapshot recovery

on:
  pull_request:
    paths:
      - scripts/image_storage_disposable_snapshot_restore.py
      - scripts/tests/test_image_storage_disposable_snapshot_restore.py
      - scripts/image_storage_backup_set.py
      - scripts/image_storage_library_coverage.py
      - scripts/media_library_backup.py
      - .github/workflows/image-storage-disposable-snapshot-restore.yml
  push:
    branches: [develop]
    paths:
      - scripts/image_storage_disposable_snapshot_restore.py
      - scripts/tests/test_image_storage_disposable_snapshot_restore.py

jobs:
  disposable-restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile full snapshot restoration scripts
        run: python -m py_compile scripts/image_storage_disposable_snapshot_restore.py scripts/tests/test_image_storage_disposable_snapshot_restore.py
      - name: Verify saved-media restoration, integrity, limits and incomplete states
        run: python -m unittest discover -s scripts/tests -p test_image_storage_disposable_snapshot_restore.py -v
