name: PR56 brace fix
on:
  push:
    branches:
      - feature/batch-video-tagging-review
    paths:
      - .github/workflows/pr56-brace-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/batch-video-tagging-review
      - name: Restore missing loop brace
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          gofmt -w internal/api/routes_scene_tagging_batch.go internal/api/routes_scene_tagging_batch_expiry.go
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/api/routes_scene_tagging_batch.go internal/api/routes_scene_tagging_batch_expiry.go
          git diff --cached --quiet && exit 0
          git commit -m "Fix batch ID loop after review hardening"
          git push
