name: Temporary shadow selection source formatter

on:
  pull_request:
    paths:
      - internal/api/routes_image_storage_shadow_selection.go
      - internal/api/routes_image_storage_shadow_selection_test.go
      - .github/workflows/temp-storage-shadow-selection-formatter.yml
jobs:
  gofmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Emit gofmt output for exact source commit
        run: |
          gofmt -w internal/api/routes_image_storage_shadow_selection.go internal/api/routes_image_storage_shadow_selection_test.go
          echo SHADOW_SRC_BEGIN
          base64 -w 0 internal/api/routes_image_storage_shadow_selection.go
          echo
          echo SHADOW_SRC_END
          echo SHADOW_TEST_BEGIN
          base64 -w 0 internal/api/routes_image_storage_shadow_selection_test.go
          echo
          echo SHADOW_TEST_END
