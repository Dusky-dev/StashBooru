name: Integrate develop into PR62
on:
  push:
    branches:
      - feature/video-frame-assisted-tagging
    paths:
      - .github/workflows/integrate-develop-pr62.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/video-frame-assisted-tagging
          fetch-depth: 0
      - name: Merge develop, preserve current review UI, add Frames, and self-clean
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          set +e
          git merge --no-edit origin/develop
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            expected="ui/v2.5/src/components/Scenes/SceneDetails/VideoTaggingDialog.tsx"
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --theirs -- "$expected"
          fi
          python - <<'PY'
          from pathlib import Path

          p = Path('ui/v2.5/src/components/Scenes/SceneDetails/VideoTaggingDialog.tsx')
          s = p.read_text()
          def replace_once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              s = s.replace(old, new)

          replace_once('type MetadataSourceKind = "local" | "booru";\n', 'type MetadataSourceKind = "local" | "booru" | "frames";\n', 'source kind')
          replace_once('''interface BooruMetadataResponse {\n  source: string;\n  postID: string;\n  postURL?: string;\n  md5: string;\n  md5Source: "filename" | "file";\n  tags: TagPrediction[];\n}\n\n''', '''interface BooruMetadataResponse {\n  source: string;\n  postID: string;\n  postURL?: string;\n  md5: string;\n  md5Source: "filename" | "file";\n  tags: TagPrediction[];\n}\n\ninterface FrameMetadataResponse {\n  backend: "local" | "remote";\n  model: string;\n  threshold: number;\n  limit: number;\n  sampleTimes: number[];\n  tags: TagPrediction[];\n}\n\n''', 'frame response')
          replace_once('''const SOURCE_PRIORITY: Record<MetadataSourceKind, number> = {\n  local: 0,\n  booru: 10,\n};\n''', '''const SOURCE_PRIORITY: Record<MetadataSourceKind, number> = {\n  local: 0,\n  booru: 10,\n  frames: 20,\n};\n''', 'source priority')
          replace_once('''  const provider = prediction.source?.startsWith("booru:")\n''', '''  if (kind === "frames") {\n    const consensus = prediction.source?.match(/^frame-analysis:(\\d+)\\/(\\d+)$/);\n    return {\n      kind,\n      label: "Frames",\n      detail: consensus\n        ? `Frame analysis: ${consensus[1]}/${consensus[2]} sampled frames`\n        : "Frame analysis",\n      priority: SOURCE_PRIORITY.frames,\n    };\n  }\n\n  const provider = prediction.source?.startsWith("booru:")\n''', 'frame source')
          replace_once('''function mergeVideoMetadataPredictions(\n  localPredictions: TagPrediction[],\n  booruPredictions: TagPrediction[]\n) {\n''', '''function mergeVideoMetadataPredictions(\n  localPredictions: TagPrediction[],\n  booruPredictions: TagPrediction[],\n  framePredictions: TagPrediction[]\n) {\n''', 'merge signature')
          replace_once('''    {\n      predictions: booruPredictions,\n      source: (prediction) => predictionSource(prediction, "booru"),\n    },\n  ]);\n}\n''', '''    {\n      predictions: booruPredictions,\n      source: (prediction) => predictionSource(prediction, "booru"),\n    },\n    {\n      predictions: framePredictions,\n      source: (prediction) => predictionSource(prediction, "frames"),\n    },\n  ]);\n}\n''', 'merge source')
          replace_once('''function sourceBadgeVariant(source: string) {\n  return source === "local" ? "success" : "info";\n}\n''', '''function sourceBadgeVariant(source: string) {\n  if (source === "local") return "success";\n  if (source === "frames") return "warning";\n  return "info";\n}\n''', 'badge variant')
          replace_once('''  const [booruPredictions, setBooruPredictions] = useState<TagPrediction[]>([]);\n  const [booruMetadata, setBooruMetadata] = useState<BooruMetadataResponse>();\n''', '''  const [booruPredictions, setBooruPredictions] = useState<TagPrediction[]>([]);\n  const [booruMetadata, setBooruMetadata] = useState<BooruMetadataResponse>();\n  const [framePredictions, setFramePredictions] = useState<TagPrediction[]>([]);\n  const [frameMetadata, setFrameMetadata] = useState<FrameMetadataResponse>();\n''', 'frame state')
          replace_once('''  const [loadingBooru, setLoadingBooru] = useState(false);\n  const [applying, setApplying] = useState(false);\n''', '''  const [loadingBooru, setLoadingBooru] = useState(false);\n  const [loadingFrames, setLoadingFrames] = useState(false);\n  const [applying, setApplying] = useState(false);\n''', 'frame loading')
          replace_once('''  const predictions = useMemo(\n    () => mergeVideoMetadataPredictions(localPredictions, booruPredictions),\n    [booruPredictions, localPredictions]\n  );\n''', '''  const predictions = useMemo(\n    () =>\n      mergeVideoMetadataPredictions(\n        localPredictions,\n        booruPredictions,\n        framePredictions\n      ),\n    [booruPredictions, framePredictions, localPredictions]\n  );\n''', 'prediction memo')
          anchor = '  const grouped = useMemo(() => {\n'
          if s.count(anchor) != 1:
              raise SystemExit('grouped anchor missing')
          frame_loader = '''  const loadFrameMetadata = useCallback(async () => {\n    setLoadingFrames(true);\n    setError(undefined);\n    try {\n      const response = await fetch(`scene/${sceneId}/frame-metadata`);\n      const result = await readResponse<FrameMetadataResponse>(response);\n      setFrameMetadata(result);\n      setFramePredictions(result.tags);\n      // Frame-assisted suggestions are review-only and start unselected.\n    } catch (cause) {\n      setError(cause instanceof Error ? cause.message : String(cause));\n    } finally {\n      setLoadingFrames(false);\n    }\n  }, [sceneId]);\n\n'''
          s = s.replace(anchor, frame_loader + anchor)
          replace_once('''              disabled={loading || loadingBooru || applying}\n              onClick={() => void loadBooruMetadata()}\n            >\n              {loadingBooru ? "Loading booru…" : "Load booru metadata"}\n            </Button>\n            <span className="ml-3 text-muted">\n              Local filename metadata loads automatically. Camie and EVA02 image\n              inference are not run for Videos.\n            </span>\n''', '''              disabled={loading || loadingBooru || loadingFrames || applying}\n              onClick={() => void loadBooruMetadata()}\n            >\n              {loadingBooru ? "Loading booru…" : "Load booru metadata"}\n            </Button>\n            <Button\n              className="ml-2"\n              variant="secondary"\n              disabled={loading || loadingBooru || loadingFrames || applying}\n              onClick={() => void loadFrameMetadata()}\n            >\n              {loadingFrames ? "Analyzing frames…" : "Analyze frames"}\n            </Button>\n            <span className="ml-3 text-muted">\n              Local filename metadata loads automatically. Representative-frame\n              Camie analysis runs only when explicitly requested; EVA02 image\n              inference is not run for Videos.\n            </span>\n''', 'frame button')
          anchor = '''          <Form.Check\n            className="mb-3"\n            type="checkbox"\n            id="video-tagging-replace-artists"\n'''
          if s.count(anchor) != 1:
              raise SystemExit('replace artists anchor missing')
          s = s.replace(anchor, '''          {frameMetadata ? (\n            <div className="alert alert-warning py-2">\n              Analyzed {frameMetadata.sampleTimes.length} representative frame\n              {frameMetadata.sampleTimes.length === 1 ? "" : "s"}. Frame\n              suggestions start unselected and cannot override Local filename\n              identity.\n            </div>\n          ) : null}\n\n''' + anchor)
          replace_once('''              No local metadata was found. You can still try an exact booru\n              lookup.\n''', '''              No local metadata was found. You can still try an exact booru\n              lookup or explicitly analyze representative frames.\n''', 'empty text')
          old = '              loading || loadingBooru || applying || visibleSelectedCount === 0\n'
          if old in s:
              s = s.replace(old, '              loading ||\n              loadingBooru ||\n              loadingFrames ||\n              applying ||\n              visibleSelectedCount === 0\n', 1)
          p.write_text(s)

          p = Path('internal/api/video_tagging_frames.go')
          s = p.read_text()
          old = '\tpredictions = enrichNativeCamiePredictionTargets(r.Context(), predictions)\n'
          new = '''\tpredictions, err = enrichNativeCamiePredictionTargets(r.Context(), predictions)\n\tif err != nil {\n\t\thttp.Error(w, fmt.Sprintf("enriching frame-assisted Video Tagging targets: %v", err), http.StatusInternalServerError)\n\t\treturn\n\t}\n'''
          if s.count(old) != 1:
              raise SystemExit(f'frame enrichment: expected 1 stale call, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          git add ui/v2.5/src/components/Scenes/SceneDetails/VideoTaggingDialog.tsx internal/api/video_tagging_frames.go internal/api/routes_scene.go internal/api/video_tagging_frames_test.go
          git rm .github/workflows/integrate-develop-pr62.yml
          git commit -m "Integrate frame-assisted Video Tagging with current review flow"
          git push origin HEAD:feature/video-frame-assisted-tagging
