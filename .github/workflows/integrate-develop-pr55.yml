name: Integrate develop into PR55
on:
  push:
    branches:
      - test/tagging-review-unit-tests
    paths:
      - .github/workflows/integrate-develop-pr55.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/tagging-review-unit-tests
          fetch-depth: 0
      - name: Merge current develop, keep canonical shared policy, and self-clean
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          set +e
          git merge --no-edit origin/develop
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            expected="ui/v2.5/src/components/Tagging/taggingReviewPolicy.ts"
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --theirs -- "$expected"
            git add "$expected"
            git commit --no-edit
          fi
          git rm .github/workflows/integrate-develop-pr55.yml
          git commit -m "Remove temporary PR55 integration workflow"
          git push origin HEAD:test/tagging-review-unit-tests
