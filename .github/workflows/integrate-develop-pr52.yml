name: Integrate develop into PR52
on:
  push:
    branches:
      - cleanup/remove-legacy-tagging-v1
    paths:
      - .github/workflows/integrate-develop-pr52.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cleanup/remove-legacy-tagging-v1
          fetch-depth: 0
      - name: Merge current develop and self-clean
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git merge --no-edit origin/develop
          git rm .github/workflows/integrate-develop-pr52.yml
          git commit -m "Remove temporary PR52 integration workflow"
          git push origin HEAD:cleanup/remove-legacy-tagging-v1
