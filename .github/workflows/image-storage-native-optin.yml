name: Experimental opt-in native packed image and thumbnail reads

on:
  pull_request:
    paths:
      - internal/api/routes_image.go
      - internal/api/routes_image_storage_native_optin.go
      - internal/api/routes_image_storage_native_optin_test.go
      - internal/api/routes_image_storage_shadow.go
      - ui/v2.5/src/components/Settings/Tasks/ImageStorageShadowTask.tsx
      - .github/workflows/image-storage-native-optin.yml
  push:
    branches: [develop]
    paths:
      - internal/api/routes_image_storage_native_optin.go
      - internal/api/routes_image_storage_native_optin_test.go

jobs:
  native-optin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Prepare minimal embedded UI fixture for API unit tests
        run: mkdir -p ui/v2.5/build && printf 'unit-test-only' > ui/v2.5/build/index.html
      - name: Generate required Go GraphQL backend code
        run: make generate-backend
      - name: Verify strict native path opt-in and shadow delegation
        run: go test ./internal/api -run '^TestStorageShadowNativeOptIn' -count=1
