name: Experimental prepared packed-image canary

on:
  pull_request:
    paths:
      - internal/api/routes_image_storage_shadow_canary.go
      - internal/api/routes_image_storage_shadow_canary_test.go
      - internal/api/routes_image.go
      - internal/api/routes_image_storage_shadow_preflight.go
      - internal/api/routes_image_storage_shadow_selection.go
      - .github/workflows/image-storage-shadow-canary.yml
  push:
    branches: [develop]
    paths:
      - internal/api/routes_image_storage_shadow_canary.go
      - internal/api/routes_image_storage_shadow_canary_test.go

jobs:
  prepared-canary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Prepare test-only embedded UI
        run: mkdir -p ui/v2.5/build && printf 'unit-test-only' > ui/v2.5/build/index.html
      - name: Generate backend required by API unit tests
        run: make generate-backend
      - name: Verify canonical Go formatting
        run: |
          gofmt -d internal/api/routes_image_storage_shadow_canary.go internal/api/routes_image_storage_shadow_canary_test.go
          test -z "$(gofmt -l internal/api/routes_image_storage_shadow_canary.go internal/api/routes_image_storage_shadow_canary_test.go)"
      - name: Verify canary request and selection fail-closed safety
        run: go test ./internal/api -run '^TestShadowCanary' -count=1
