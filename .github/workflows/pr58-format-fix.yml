name: PR58 format fix

on:
  push:
    branches:
      - feature/library-similarity-metadata-source
    paths:
      - .github/workflows/pr58-format-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/library-similarity-metadata-source
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/v2.5/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/v2.5/pnpm-lock.yaml
      - name: Format changed files
        shell: bash
        run: |
          gofmt -w internal/api/library_similarity_metadata.go internal/api/library_similarity_metadata_test.go internal/api/routes_image.go
          cd ui/v2.5
          pnpm install --frozen-lockfile
          pnpm exec biome format --write src/components/Images/ImageDetails/ImageKnowledgeTagDialog.tsx
          cd ../..
          git diff --check
      - name: Commit format fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/api/library_similarity_metadata.go internal/api/library_similarity_metadata_test.go internal/api/routes_image.go ui/v2.5/src/components/Images/ImageDetails/ImageKnowledgeTagDialog.tsx
          git commit -m "Format library similarity metadata integration"
          git push origin HEAD:feature/library-similarity-metadata-source
