name: Image restoration

on:
  pull_request:
    paths:
      - scripts/image_restoration_worker.py
      - scripts/visual_embedding_server.py
      - scripts/tests/test_image_restoration.py
      - pkg/imagerestore/**
      - .github/workflows/image-restoration.yml
      - ui/v2.5/src/components/Shared/ImageRestorationDialog*
      - ui/v2.5/src/components/Shared/restorationMask.ts
      - ui/v2.5/tests/browser/image-restoration.mjs
      - ui/v2.5/tests/browser/fixtures/image-restoration*
      - ui/v2.5/pnpm-lock.yaml
  push:
    branches: [develop]
    paths:
      - scripts/image_restoration_worker.py
      - scripts/visual_embedding_server.py
      - scripts/tests/test_image_restoration.py
      - pkg/imagerestore/**
      - .github/workflows/image-restoration.yml

jobs:
  restoration-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install image decoder
        run: sudo apt-get update && sudo apt-get install -y python3-pil
      - name: Check mask, adapter and authenticated remote contract
        run: python3 -m unittest discover -s scripts/tests -p test_image_restoration.py -v

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          package_json_file: ui/v2.5/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: ui/v2.5/pnpm-lock.yaml
      - name: Install locked UI dependencies
        run: pnpm --dir ui/v2.5 install --frozen-lockfile
      - name: Prepare UI source dependencies
        run: |
          pnpm --dir ui/v2.5 run gqlgen
          pnpm --dir ui/v2.5 run prepare-builtins
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/restoration-tools" playwright@1.57.0
          node "$RUNNER_TEMP/restoration-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Mounted desktop and mobile restoration workflow
        working-directory: ui/v2.5
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/restoration-tools/node_modules/playwright/index.mjs
          STASH_BROWSER_SCREENSHOTS: ${{ runner.temp }}/restoration-screenshots
        run: node tests/browser/image-restoration.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: restoration-screenshots
          path: ${{ runner.temp }}/restoration-screenshots
          if-no-files-found: ignore
          retention-days: 7
