name: Fix PR56 enrichment error propagation
on:
  push:
    branches:
      - feature/batch-video-tagging-review
    paths:
      - .github/workflows/fix-pr56-enrichment.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/batch-video-tagging-review
          fetch-depth: 0
      - name: Update batch enrichment call sites and self-clean
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          p = Path('internal/api/routes_scene_tagging_batch.go')
          s = p.read_text()
          old_local = '''\t\tlocal = enrichNativeCamiePredictionTargets(ctx, local)\n'''
          new_local = '''\t\tlocal, err = enrichNativeCamiePredictionTargets(ctx, local)\n\t\tif err != nil {\n\t\t\tresult.Error = fmt.Sprintf("enriching local batch Video Tagging metadata targets: %v", err)\n\t\t\treturn result\n\t\t}\n'''
          old_booru = '''\tpredictions = enrichNativeCamiePredictionTargets(ctx, predictions)\n\treturn predictions, true, nil\n'''
          new_booru = '''\tpredictions, err = enrichNativeCamiePredictionTargets(ctx, predictions)\n\tif err != nil {\n\t\treturn nil, false, fmt.Errorf("enriching booru batch Video Tagging targets: %w", err)\n\t}\n\treturn predictions, true, nil\n'''
          if s.count(old_local) != 1 or s.count(old_booru) != 1:
              raise SystemExit('expected PR56 enrichment call sites not found exactly once')
          s = s.replace(old_local, new_local).replace(old_booru, new_booru)
          p.write_text(s)
          PY
          git rm .github/workflows/fix-pr56-enrichment.yml
          git add internal/api/routes_scene_tagging_batch.go
          git commit -m "Propagate batch Video Tagging enrichment errors"
          git push origin HEAD:feature/batch-video-tagging-review
