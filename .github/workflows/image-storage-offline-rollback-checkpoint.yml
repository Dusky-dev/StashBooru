name: Experimental offline rollback checkpoint

on:
  pull_request:
    paths:
      - scripts/image_storage_disposable_rollback_checkpoint.py
      - scripts/tests/test_image_storage_disposable_rollback_checkpoint.py
      - scripts/image_storage_disposable_all_file_rebase.py
      - scripts/image_storage_disposable_snapshot_restore.py
      - .github/workflows/image-storage-offline-rollback-checkpoint.yml
  push:
    branches: [develop]
    paths:
      - scripts/image_storage_disposable_rollback_checkpoint.py
      - scripts/tests/test_image_storage_disposable_rollback_checkpoint.py

jobs:
  offline-rollback:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile rollback checkpoint tool and regression tests
        run: python -m py_compile scripts/image_storage_disposable_rollback_checkpoint.py scripts/tests/test_image_storage_disposable_rollback_checkpoint.py
      - name: Verify saved backup, scratch restoration, interruption, restart and tamper refusal
        run: python -m unittest discover -s scripts/tests -p test_image_storage_disposable_rollback_checkpoint.py -v
