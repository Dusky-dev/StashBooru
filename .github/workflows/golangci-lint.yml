name: Lint (golangci-lint)
on:
  push:
    tags:
      - v*
    branches:
      - master
      - develop
      - 'releases/**'
  pull_request:

jobs:
  golangci:
    name: lint
    # CGO sqlite-vec needs sqlite3.h; hosted Ubuntu provides an isolated apt environment.
    runs-on: ubuntu-24.04
    steps:
      # no tags or depth needed for lint
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Install SQLite CGO headers
        run: |
          # Avoid the Azure mirror that can hang apt-get update (as in build.yml).
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          if [ -f /etc/apt/apt-security-mirrors.txt ]; then
            printf '%s\n' 'https://security.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-security-mirrors.txt > /dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev

      # generate-backend runs natively (just go generate + touch-ui) — no Docker needed
      - name: Generate Backend
        run: make generate-backend

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
