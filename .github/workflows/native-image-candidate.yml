name: Native image candidate packing safety

on:
  pull_request:
    paths:
      - scripts/image_storage_native_candidate.py
      - scripts/tests/test_image_storage_native_candidate.py
      - scripts/image_storage_backup_preflight.py
      - scripts/image_storage_pack_proof.py
      - .github/workflows/native-image-candidate.yml
      - internal/api/routes_image_storage_candidate.go
      - internal/api/routes_image_storage_candidate_test.go
  push:
    branches: [develop]
    paths:
      - scripts/image_storage_native_candidate.py
      - scripts/tests/test_image_storage_native_candidate.py
      - .github/workflows/native-image-candidate.yml

jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install bounded archive dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Compile native candidate and test scripts
        run: python -m py_compile scripts/image_storage_native_candidate.py scripts/tests/test_image_storage_native_candidate.py
      - name: Verify backup-gated byte-exact publication and refusal cases
        run: python -m unittest discover -s scripts/tests -p test_image_storage_native_candidate.py -v
