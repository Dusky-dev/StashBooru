name: PR56 review fixes
on:
  push:
    branches:
      - feature/batch-video-tagging-review
    paths:
      - .github/workflows/pr56-review-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/batch-video-tagging-review
      - name: Apply review fixes
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/api/routes_scene.go internal/api/routes_scene_tagging.go internal/api/routes_scene_tagging_batch.go ui/v2.5/src/components/Scenes/BatchVideoTaggingPatch.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Harden batch Video Tagging integration"
          git push
