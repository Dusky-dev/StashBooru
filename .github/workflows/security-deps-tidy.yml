name: Security dependency tidy

on:
  push:
    branches:
      - security-2026-cve-dependency-upgrades

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: security-2026-cve-dependency-upgrades
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Tidy modules
        run: go mod tidy
      - name: Commit module metadata
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo "Module metadata is already tidy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "security: refresh Go module checksums"
          git push origin HEAD:security-2026-cve-dependency-upgrades
