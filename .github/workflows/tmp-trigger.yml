name: Temporary final branch validation
on:
  push:
    branches:
      - fix/unified-media-preserve-native-children
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/unified-media-preserve-native-children
      - run: |
          rm .github/workflows/tmp-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tmp-trigger.yml
          git commit -m "Remove temporary final validation trigger"
          git push origin HEAD:fix/unified-media-preserve-native-children
