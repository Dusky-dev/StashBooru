name: Experimental bounded mapped scratch restoration

on:
  pull_request:
    paths:
      - scripts/image_storage_bounded_recovery.py
      - scripts/tests/test_image_storage_bounded_recovery.py
      - scripts/image_storage_historical_paths.py
      - scripts/image_storage_isolated_recovery.py
      - scripts/media_library_backup.py
      - .github/workflows/image-storage-bounded-recovery.yml
  push:
    branches: [develop]
    paths:
      - scripts/image_storage_bounded_recovery.py
      - scripts/tests/test_image_storage_bounded_recovery.py

jobs:
  bounded-recovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install synthetic archive fixture dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Check Python syntax
        run: python -m py_compile scripts/image_storage_bounded_recovery.py scripts/tests/test_image_storage_bounded_recovery.py
      - name: Verify bounded mapped scratch recovery
        run: python -m unittest discover -s scripts/tests -p test_image_storage_bounded_recovery.py -v
