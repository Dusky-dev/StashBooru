name: Temporary P04 primary Copyright fix

on:
  push:
    branches:
      - feature/p04-copyright-branches
    paths:
      - .github/workflows/tmp-p04-primary-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/p04-copyright-branches
          fetch-depth: 0
      - name: Apply primary Copyright fix
        run: python .github/scripts/tmp_p04_primary_fix.py
      - name: Format Go files
        run: gofmt -w pkg/sqlite/copyright.go pkg/sqlite/copyright_taxonomy.go pkg/sqlite/copyright_taxonomy_test.go
      - name: Run focused Copyright tests
        run: go test ./pkg/sqlite -run 'TestCopyright(SubtreeCountsDeduplicateMultiParentPaths|TaxonomyOrderingRolesAndPrimary|HierarchyValidation|DirectorySorting)$'
      - name: Remove temporary patch files
        run: rm .github/scripts/tmp_p04_primary_fix.py .github/workflows/tmp-p04-primary-fix.yml
      - name: Commit patch
        run: |
          git config user.name "Dusky"
          git config user.email "76793489+Dusky-dev@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Preserve primary Copyright across media edits"
          git push origin HEAD:feature/p04-copyright-branches
