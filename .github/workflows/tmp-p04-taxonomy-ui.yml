name: Temporary P04 taxonomy UI patch

on:
  push:
    branches:
      - feature/p04-copyright-branches
    paths:
      - .github/workflows/tmp-p04-taxonomy-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/p04-copyright-branches
          fetch-depth: 0
      - name: Apply taxonomy UI patch
        run: python .github/scripts/tmp_p04_taxonomy_ui.py
      - name: Remove temporary patch files
        run: rm .github/scripts/tmp_p04_taxonomy_ui.py .github/workflows/tmp-p04-taxonomy-ui.yml
      - name: Commit patch
        run: |
          git config user.name "Dusky"
          git config user.email "76793489+Dusky-dev@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete Copyright taxonomy detail UI"
          git push origin HEAD:feature/p04-copyright-branches
