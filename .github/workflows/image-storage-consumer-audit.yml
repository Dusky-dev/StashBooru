name: Experimental P12 P13 full-stack media audit

on:
  pull_request:
    paths:
      - scripts/image_storage_shadow_audit.py
      - scripts/tests/test_image_storage_shadow_audit.py
      - internal/api/routes_image_storage_consumer_audit.go
      - internal/api/routes_image_storage_consumer_audit_test.go
      - .github/workflows/image-storage-consumer-audit.yml
  push:
    branches: [develop]
    paths:
      - scripts/image_storage_shadow_audit.py
      - scripts/tests/test_image_storage_shadow_audit.py

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install bounded archive proof dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Compile read-only script and tests
        run: python -m py_compile scripts/image_storage_shadow_audit.py scripts/tests/test_image_storage_shadow_audit.py
      - name: Verify complete P12 P13 member equality and refusals
        run: python -m unittest discover -s scripts/tests -p test_image_storage_shadow_audit.py -v
