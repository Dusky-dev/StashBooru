name: Experimental saved library image coverage audit

on:
  pull_request:
    paths:
      - scripts/image_storage_library_coverage.py
      - scripts/tests/test_image_storage_library_coverage.py
      - scripts/image_storage_historical_paths.py
      - scripts/image_storage_backup_set.py
      - scripts/media_library_backup.py
      - .github/workflows/image-storage-library-coverage.yml
  push:
    branches: [develop]
    paths:
      - scripts/image_storage_library_coverage.py
      - scripts/tests/test_image_storage_library_coverage.py

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check offline coverage source syntax
        run: python -m py_compile scripts/image_storage_library_coverage.py scripts/tests/test_image_storage_library_coverage.py
      - name: Audit synthetic missing and mismatched historical originals
        run: python -m unittest discover -s scripts/tests -p test_image_storage_library_coverage.py -v
