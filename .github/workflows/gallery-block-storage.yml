name: Gallery block storage prototype

on:
  pull_request:
    paths:
      - scripts/gallery_block_storage.py
      - scripts/image_delta_storage.py
      - scripts/tests/test_gallery_block_storage.py
      - scripts/tests/gallery_block_fixtures.py
      - scripts/tests/image_delta_fixtures.py
      - .github/workflows/gallery-block-storage.yml
      - docs/p13-gallery-block-storage.md
  push:
    branches: [develop]
    paths:
      - scripts/gallery_block_storage.py
      - scripts/image_delta_storage.py
      - scripts/tests/test_gallery_block_storage.py
      - scripts/tests/gallery_block_fixtures.py
      - scripts/tests/image_delta_fixtures.py
      - .github/workflows/gallery-block-storage.yml

jobs:
  gallery-fidelity-and-recovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install image and array dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-pil python3-numpy
      - name: Verify complete storage accounting, independent access and crash recovery
        run: python3 -m unittest discover -s scripts/tests -p test_gallery_block_storage.py -v
      - name: Measure labelled repository and synthetic galleries
        run: python3 scripts/tests/gallery_block_fixtures.py --output p13-benchmark.json
      - uses: actions/upload-artifact@v7
        with:
          name: p13-gallery-benchmark
          path: p13-benchmark.json
