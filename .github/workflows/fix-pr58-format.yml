name: Fix PR58 UI format
on:
  push:
    branches:
      - feature/library-similarity-metadata-source
    paths:
      - .github/workflows/fix-pr58-format.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/library-similarity-metadata-source
          fetch-depth: 0
      - name: Apply exact Biome-requested formatting and self-clean
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          p = Path('ui/v2.5/src/components/Images/ImageDetails/ImageKnowledgeTagDialog.tsx')
          s = p.read_text()
          old = '''type MetadataSourceKind =\n  | "local"\n  | "booru"\n  | "camie"\n  | "eva02"\n  | "library";\n'''
          new = 'type MetadataSourceKind = "local" | "booru" | "camie" | "eva02" | "library";\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one union block, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          git rm .github/workflows/fix-pr58-format.yml
          git add ui/v2.5/src/components/Images/ImageDetails/ImageKnowledgeTagDialog.tsx
          git commit -m "Format PR58 Image Tagging source type"
          git push origin HEAD:feature/library-similarity-metadata-source
