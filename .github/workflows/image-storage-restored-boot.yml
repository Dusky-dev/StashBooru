name: Experimental restored-app boot syntax

on:
  pull_request:
    paths:
      - ui/v2.5/tests/browser/helpers/recovered-app-boot.mjs
      - ui/v2.5/tests/browser/storage-native-packed-acceptance.mjs
      - .github/workflows/image-storage-restored-boot.yml
  push:
    branches: [develop]
    paths:
      - ui/v2.5/tests/browser/helpers/recovered-app-boot.mjs
      - .github/workflows/image-storage-restored-boot.yml

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Compile isolated restored-app boot acceptance sources
        run: |
          node --check ui/v2.5/tests/browser/helpers/recovered-app-boot.mjs
          node --check ui/v2.5/tests/browser/storage-native-packed-acceptance.mjs
      - name: Check no production activation or eviction was added
        run: |
          ! grep -E '(^|[[:space:]])(unlink|rmSync|rmdirSync|execSync)\(' ui/v2.5/tests/browser/helpers/recovered-app-boot.mjs

  formatting-suggestion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install repository-pinned Biome
        run: npm install --prefix "$RUNNER_TEMP/biome-tool" --no-audit --no-fund @biomejs/biome@2.5.0
      - name: Show exact formatted test files for review
        run: |
          set -e
          cd ui/v2.5
          "$RUNNER_TEMP/biome-tool/node_modules/.bin/biome" format --write \
            tests/browser/helpers/recovered-app-boot.mjs \
            tests/browser/storage-native-packed-acceptance.mjs
          for f in tests/browser/helpers/recovered-app-boot.mjs tests/browser/storage-native-packed-acceptance.mjs; do
            echo "FORMAT-BEGIN:$f"
            base64 -w0 "$f"
            echo
            echo "FORMAT-END:$f"
          done
